appId: app.transmissionhelm.desktop
productName: Transmission Helm
copyright: Copyright © 2026 Transmission Helm contributors
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!vitest.config.*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  - '!*.md'
  - '!notes/**'
  - '!.*/**'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
afterPack: build/afterPack.cjs
asarUnpack:
  - resources/**
fileAssociations:
  - ext: torrent
    name: BitTorrent file
    mimeType: application/x-bittorrent
    role: Viewer
protocols:
  - name: Magnet link
    schemes: [magnet]
win:
  executableName: TransmissionHelm
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  category: public.app-category.utilities
  artifactName: ${name}-${version}-mac-arm64.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
linux:
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  maintainer: Transmission Helm contributors <noreply@github.com>
  category: Network
  synopsis: Remote control for the Transmission BitTorrent daemon
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
npmRebuild: false
publish:
  provider: github
  owner: transmission-helm
  repo: transmission-helm
  releaseType: draft
